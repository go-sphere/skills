name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: bash tests/run-tests.sh
